<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain — The Memory Graph</title>
<meta name="description" content="An interactive 3D memory graph of the Second Brain system: markdown files that remember, rules that verify.">
<style>
  :root{
    --ink:#12101f; --ink2:#23203b; --gold:#f2b134; --gold-soft:#ffd27a;
    --coral:#ff6b4a; --cream:#fff6e9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--cream);
    background:radial-gradient(120% 90% at 50% 38%, #2b2650 0%, var(--ink2) 42%, var(--ink) 78%, #0b0a16 100%);
  }
  #scene{position:fixed;inset:0;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(85% 70% at 50% 46%, transparent 55%, rgba(5,4,12,.55) 100%)}
  header{position:fixed;top:34px;left:40px;pointer-events:none;z-index:5}
  header .over{font-size:11px;letter-spacing:.34em;color:var(--gold);
    text-transform:uppercase;font-weight:600}
  header h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;
    font-size:52px;line-height:1.04;color:var(--cream);margin-top:10px;
    text-shadow:0 2px 30px rgba(0,0,0,.45)}
  header h1 em{font-style:italic;color:var(--gold-soft)}
  header .tag{margin-top:12px;font-size:15px;color:rgba(255,246,233,.78);max-width:340px;line-height:1.5}
  footer{position:fixed;left:40px;bottom:30px;z-index:5;pointer-events:none;
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,246,233,.55)}
  footer b{color:var(--coral);font-weight:600}
  .hint{position:fixed;right:40px;bottom:30px;z-index:5;pointer-events:none;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,246,233,.4)}
  .label{position:fixed;left:0;top:0;z-index:4;pointer-events:none;white-space:nowrap;
    transform:translate(-50%,-160%);
    font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cream);padding:6px 12px 7px;border-radius:999px;
    background:rgba(14,12,28,.58);border:1px solid rgba(242,177,52,.38);
    box-shadow:0 4px 18px rgba(0,0,0,.35);backdrop-filter:blur(2px)}
  .label::after{content:"";position:absolute;left:50%;bottom:-5px;width:7px;height:7px;
    transform:translateX(-50%) rotate(45deg);
    background:rgba(14,12,28,.58);border-right:1px solid rgba(242,177,52,.38);
    border-bottom:1px solid rgba(242,177,52,.38)}
  @media (max-width:560px){
    header{top:20px;left:20px}
    header h1{font-size:34px}
    header .tag{display:none}
    header .over{font-size:9.5px}
    footer{left:20px;bottom:18px;font-size:9.5px}
    .hint{display:none}
    .label{font-size:9.5px;padding:4px 8px 5px;letter-spacing:.1em}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<header>
  <div class="over">The memory system behind AI Radar</div>
  <h1>Second <em>Brain</em></h1>
  <div class="tag">Markdown files that remember, rules that verify. Every node is a file the agent reads before it acts.</div>
</header>
<footer>Memory <b>·</b> People <b>·</b> Rules <b>·</b> Proof</footer>
<div class="hint">Drag to spin</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="./three.min.js"><\/script>')}</script>
<script>
(function(){
  "use strict";
  var params = new URLSearchParams(location.search);
  var stillT = params.has("still") ? parseFloat(params.get("still")) : null;
  var showLabels = params.get("labels") !== "0";

  /* ---------- seeded rng so the composition is curated, not random ---------- */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296}}
  var rand = mulberry32(20261110);

  var canvas = document.getElementById("scene");
  var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 1, 2000);

  function frameCamera(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h;
    // fit the brain's full width (plus label headroom) on narrow screens,
    // not just its height — portrait phones would otherwise crop the sides
    var halfFovTan = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    var distForWidth = 152 / (halfFovTan * camera.aspect);
    camera.position.set(0, 6, Math.max(355, distForWidth));
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
  }
  frameCamera();
  window.addEventListener("resize", frameCamera);

  /* ---------- glow sprite texture ---------- */
  function glowTexture(inner, outer){
    var c = document.createElement("canvas"); c.width = c.height = 128;
    var g = c.getContext("2d");
    var grad = g.createRadialGradient(64,64,0,64,64,64);
    grad.addColorStop(0, inner); grad.addColorStop(0.35, outer); grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  var dotTex  = glowTexture("rgba(255,255,255,1)", "rgba(255,255,255,.28)");
  var haloTex = glowTexture("rgba(255,210,122,.85)", "rgba(242,177,52,.18)");

  var brain = new THREE.Group(); scene.add(brain);
  var R = 100;

  /* ---------- brain-shaped point cloud ---------- */
  function brainPoint(){
    // fibonacci-ish random direction
    var u = rand()*2-1, th = rand()*Math.PI*2;
    var s = Math.sqrt(1-u*u);
    var x = s*Math.cos(th), y = u, z = s*Math.sin(th);
    var r = R * (0.86 + rand()*0.16);
    var px = x*r*1.04, py = y*r*0.92, pz = z*r*1.16;
    // sagittal fissure: push hemispheres apart, dip the top centreline
    var side = px >= 0 ? 1 : -1;
    px += side * 3.2;
    if (Math.abs(x) < 0.14 && py > 0) py -= (0.14-Math.abs(x)) * 42;
    // gentle organic lumpiness
    var n = Math.sin(px*0.055)*Math.cos(pz*0.062)*3.4 + Math.sin(pz*0.09+py*0.05)*2.2;
    px += x*n; py += y*n; pz += z*n;
    return new THREE.Vector3(px, py, pz);
  }

  var N = 850, nodes = [];
  for (var i=0;i<N;i++) nodes.push(brainPoint());

  var golds = [new THREE.Color("#f2b134"), new THREE.Color("#ffd27a"),
               new THREE.Color("#ffb84d"), new THREE.Color("#e8930c"),
               new THREE.Color("#fff0c2")];
  var pos = new Float32Array(N*3), col = new Float32Array(N*3);
  nodes.forEach(function(p, i){
    pos.set([p.x, p.y, p.z], i*3);
    var c = golds[Math.floor(rand()*golds.length)];
    col.set([c.r, c.g, c.b], i*3);
  });
  var cloudGeo = new THREE.BufferGeometry();
  cloudGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  cloudGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  var cloud = new THREE.Points(cloudGeo, new THREE.PointsMaterial({
    size: 4.0, map: dotTex, vertexColors: true, transparent: true, opacity: 0.95,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  }));
  brain.add(cloud);

  /* ---------- coral synapses between near neighbours ---------- */
  var linePos = [];
  var maxLines = 2600;
  for (var a=0; a<N && linePos.length/6 < maxLines; a++){
    for (var b=a+1; b<N; b++){
      var d = nodes[a].distanceTo(nodes[b]);
      if (d < 27){
        linePos.push(nodes[a].x, nodes[a].y, nodes[a].z, nodes[b].x, nodes[b].y, nodes[b].z);
        if (linePos.length/6 >= maxLines) break;
      }
    }
  }
  var lineGeo = new THREE.BufferGeometry();
  lineGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(linePos), 3));
  var lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
    color: new THREE.Color("#ff6b4a"), transparent: true, opacity: 0.10,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  brain.add(lines);

  /* ---------- ambient dust ---------- */
  var dustN = 260, dustPos = new Float32Array(dustN*3);
  for (var k=0;k<dustN;k++){
    var du = rand()*2-1, dth = rand()*Math.PI*2, ds = Math.sqrt(1-du*du);
    var dr = 190 + rand()*260;
    dustPos.set([ds*Math.cos(dth)*dr, du*dr*0.7, ds*Math.sin(dth)*dr], k*3);
  }
  var dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
  var dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    size: 1.7, map: dotTex, color: new THREE.Color("#fff6e9"), transparent: true,
    opacity: 0.32, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  scene.add(dust);

  /* ---------- core glow ---------- */
  var core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: haloTex, color: new THREE.Color("#f2b134"), transparent: true,
    opacity: 0.16, depthWrite: false, blending: THREE.AdditiveBlending
  }));
  core.scale.set(300, 300, 1); brain.add(core);

  /* ---------- hero nodes: the system's real parts ---------- */
  var heroes = [
    {name:"MEMORY.md",        dir:[-0.18, 0.86, 0.46]},
    {name:"USER.md",          dir:[ 0.78, 0.30, 0.55]},
    {name:"SOUL.md",          dir:[-0.80, 0.28, 0.52]},
    {name:"People Index",     dir:[ 0.94,-0.18, 0.30]},
    {name:"Verification Gate",dir:[-0.95,-0.14, 0.28]},
    {name:"Promise Audit",    dir:[ 0.52, 0.62,-0.60]},
    {name:"Taste Profile",    dir:[ 0.30,-0.78, 0.55]},
    {name:"Daily Logs",       dir:[-0.45,-0.62,-0.62]}
  ];
  var heroGroup = new THREE.Group(); brain.add(heroGroup);
  var heroMat = new THREE.MeshBasicMaterial({color: new THREE.Color("#ffcf5e")});
  heroes.forEach(function(h, idx){
    var d = new THREE.Vector3(h.dir[0], h.dir[1], h.dir[2]).normalize();
    var p = new THREE.Vector3(d.x*R*1.06 + (d.x>=0?3.2:-3.2), d.y*R*0.94, d.z*R*1.18);
    h.pos = p;
    var m = new THREE.Mesh(new THREE.SphereGeometry(3.1, 20, 20), heroMat);
    m.position.copy(p); heroGroup.add(m);
    var halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: haloTex, color: new THREE.Color("#f2b134"), transparent: true,
      opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending
    }));
    halo.scale.set(30, 30, 1); halo.position.copy(p); heroGroup.add(halo);
    h.halo = halo; h.phase = idx * 0.9;
    // bright coral threads from hero to its nearest neighbours
    var near = nodes.map(function(n){return {n:n, d:n.distanceTo(p)}})
                    .sort(function(x,y){return x.d-y.d}).slice(0,5);
    var tp = [];
    near.forEach(function(o){ tp.push(p.x, p.y, p.z, o.n.x, o.n.y, o.n.z); });
    var tg = new THREE.BufferGeometry();
    tg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(tp), 3));
    heroGroup.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial({
      color: new THREE.Color("#ff6b4a"), transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false
    })));
    if (showLabels){
      var el = document.createElement("div");
      el.className = "label"; el.textContent = h.name;
      document.body.appendChild(el); h.el = el;
    }
  });

  /* ---------- interaction: drag to spin ---------- */
  var dragging = false, px0 = 0, py0 = 0, velY = 0.0016, targetX = 0.10, baseX = 0.10;
  function down(x, y){ dragging = true; px0 = x; py0 = y; }
  function move(x, y){
    if (!dragging) return;
    brain.rotation.y += (x - px0) * 0.005;
    targetX = Math.max(-0.6, Math.min(0.6, targetX + (y - py0) * 0.003));
    px0 = x; py0 = y;
  }
  function up(){ dragging = false; }
  canvas.addEventListener("pointerdown", function(e){ down(e.clientX, e.clientY); });
  window.addEventListener("pointermove", function(e){ move(e.clientX, e.clientY); });
  window.addEventListener("pointerup", up);

  /* ---------- render loop ---------- */
  var v3 = new THREE.Vector3(), camDir = new THREE.Vector3();
  function render(t){
    if (stillT !== null) brain.rotation.y = stillT * 0.30;
    else brain.rotation.y += velY;
    brain.rotation.x += ((baseX + Math.sin(t*0.13)*0.045 + (targetX-baseX)) - brain.rotation.x) * 0.06;
    core.material.opacity = 0.14 + Math.sin(t*0.7)*0.03;
    heroes.forEach(function(h){
      var s = 30 + Math.sin(t*1.4 + h.phase)*4.5;
      h.halo.scale.set(s, s, 1);
    });
    dust.rotation.y -= 0.00035;
    renderer.render(scene, camera);
    // labels: project + fade the far side
    camera.getWorldDirection(camDir);
    heroes.forEach(function(h){
      if (!h.el) return;
      v3.copy(h.pos).applyMatrix4(brain.matrixWorld);
      var facing = v3.clone().normalize().dot(camDir) ; // negative = facing camera
      var proj = v3.clone().project(camera);
      var x = (proj.x*0.5+0.5) * window.innerWidth;
      var y = (-proj.y*0.5+0.5) * window.innerHeight;
      var half = h.el.offsetWidth/2 + 6;
      x = Math.max(half, Math.min(window.innerWidth - half, x));
      h.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) translate(-50%,-170%)";
      var o = THREE.MathUtils.clamp((-facing - 0.05) * 3.2, 0, 1);
      h.el.style.opacity = o.toFixed(2);
    });
  }
  if (stillT !== null){
    // deterministic frozen frame for captures — keep redrawing the same
    // frame so the compositor always has a fresh drawing buffer
    (function loopStill(){ render(stillT); requestAnimationFrame(loopStill); })();
  } else {
    var start = performance.now();
    (function loop(now){
      render((now - start)/1000);
      requestAnimationFrame(loop);
    })(start);
  }
})();
</script>
</body>
</html>
